name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --ignore-scripts
        continue-on-error: true
      - run: npm test
        continue-on-error: true
