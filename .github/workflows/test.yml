name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.16.0'
      - name: Check exact media source syntax
        run: |
          node --check src/media-social-receiving.mjs
          node --check src/accepted-media-publication.mjs
          node --check test/media-social-receiving.test.mjs
          node --check test/accepted-media-publication.test.mjs
      - name: Execute dependency-free social receiving admission
        run: node --test test/media-social-receiving.test.mjs
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.16.0'
      - name: Install actual selected source dependencies
        run: npm install --ignore-scripts
      - name: Receive complete native Media Engineering suite
        run: npm test
